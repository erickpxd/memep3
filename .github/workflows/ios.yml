name: Build iOS companion

on:
  push:
    paths:
      - mobile/ios/**
      - .github/workflows/ios.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - run: brew list xcodegen || brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project MemeP3.xcodeproj -scheme MemeP3 -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
